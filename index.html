<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SIPINTAR — SMPN 26 Surakarta</title>
<meta name="description" content="Portal ujian digital SIPINTAR, SMP Negeri 26 Surakarta.">
<meta name="theme-color" content="#1b3a6b">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{ --navy:#1b3a6b; --gold:#d4a017; --card:rgba(15,30,58,.72); --line:rgba(255,255,255,.16); --txt:#f8fafc; --dim:#c7d2fe; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);
    background: linear-gradient(180deg, rgba(15,30,58,.78), rgba(20,48,86,.82)), url('background.png') center/cover no-repeat fixed, var(--navy);
    display:flex;align-items:center;justify-content:center;padding:24px;min-height:100dvh;
  }
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 28px 24px;text-align:center;backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .logo-img{width:220px;max-width:78%;margin:0 auto 10px;display:block;filter:drop-shadow(0 12px 28px rgba(0,0,0,.45))}
  h1{font-size:1.4rem;font-weight:800;letter-spacing:.08em}
  .school{color:#fde68a;font-size:.92rem;font-weight:700;margin-top:6px}
  .motto{color:var(--dim);font-size:.78rem;font-style:italic;margin-top:4px}
  .pill{display:inline-flex;align-items:center;gap:7px;margin:18px auto 4px;font-size:.75rem;font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:7px 14px;border-radius:999px;color:#cbd5e1}
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.18)}
  .dot.off{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.18)}
  .btn{width:100%;border:none;cursor:pointer;font:inherit;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 20px;border-radius:16px;font-weight:800;font-size:1.02rem}
  .btn:active{transform:scale(.97)}
  .btn-primary{margin-top:20px;color:#1b3a6b;background:linear-gradient(135deg,#f5d76e,#d4a017);box-shadow:0 12px 28px rgba(212,160,23,.35)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn-ghost{margin-top:12px;color:#e0e7ff;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:.92rem;font-weight:700}
  .hidden{display:none !important}
  .note{margin-top:14px;font-size:.72rem;color:#94a3b8;line-height:1.5}
  .foot{margin-top:18px;font-size:.68rem;color:rgba(199,210,254,.7);line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <img class="logo-img" src="logo.png" alt="Logo SIPINTAR">
  <h1>SIPINTAR</h1>
  <p class="school">SMP Negeri 26 Surakarta</p>
  <p class="motto">Widya Bhakti Jaya Negara</p>
  <div class="pill"><span id="dot" class="dot"></span><span id="status-text">Memeriksa koneksi…</span></div>
  <button id="btn-open" class="btn btn-primary" disabled>Buka Aplikasi</button>
  <button id="btn-install" class="btn btn-ghost hidden">Install ke Perangkat</button>
  <p class="note" id="net-note"></p>
  <p class="foot">v<span id="app-ver">-</span> · © Copyright Teknologi Pendidikan Version 2<br>Arif Nuur Iswahyudi, S.Pd., Gr · 2026<br>Jl. Joyonegaran No. 02, Surakarta</p>
</main>
<script src="config.js"></script>
<script>
(function () {
  var CFG = window.APP_CONFIG || {};
  document.getElementById('app-ver').textContent = CFG.APP_VERSION || '2.0';
  var btnOpen = document.getElementById('btn-open');
  var btnInstall = document.getElementById('btn-install');
  function getUrl() { return String(CFG.GAS_WEB_APP_URL || '').trim(); }
  function ok(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/.test(u); }
  function refresh() {
    var url = getUrl();
    var online = navigator.onLine;
    document.getElementById('dot').className = 'dot' + (online ? '' : ' off');
    document.getElementById('status-text').textContent = !online ? 'Offline' : (ok(url) ? 'Terhubung · siap dibuka' : 'URL belum disetel');
    btnOpen.disabled = !ok(url) || !online;
    document.getElementById('net-note').textContent = !online ? 'Butuh koneksi internet.' : '';
  }
  btnOpen.addEventListener('click', function () {
    var url = getUrl();
    if (!ok(url)) return;
    window.location.href = url;
  });
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e; btnInstall.classList.remove('hidden');
  });
  btnInstall.addEventListener('click', function () {
    if (!deferred) { alert('Gunakan menu browser: Install aplikasi / Tambahkan ke layar utama.'); return; }
    deferred.prompt();
  });
  window.addEventListener('online', refresh);
  window.addEventListener('offline', refresh);
  refresh();
})();
</script>

</html>
